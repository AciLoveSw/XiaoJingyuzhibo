<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1920px;background:transparent;overflow:hidden;
            font-family:"Microsoft YaHei",sans-serif}
  #stage{position:absolute;left:0;bottom:0;width:1080px;height:1920px;perspective:1100px;perspective-origin:50% 72%}
  #shadow{position:absolute;left:96px;bottom:496px;width:470px;height:56px;border-radius:50%;animation:swayShadow 7s ease-in-out infinite;
          
          background:radial-gradient(ellipse at center, rgba(0,0,0,.55), rgba(0,0,0,0) 72%);
          filter:blur(4px);transform-origin:50% 50%}
  @keyframes swayShadow{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  #charWrap{position:absolute;left:56px;bottom:520px;width:560px;height:582px;
           transform-origin:50% 96%;animation:swayIdle 7s ease-in-out infinite}
  @keyframes swayIdle{
    0%,100%{transform:translateX(0) rotateZ(0)}
    25%{transform:translateX(-6px) rotateZ(-1.4deg)}
    75%{transform:translateX(6px) rotateZ(1.4deg)}}
  #char{position:absolute;left:0;bottom:0;width:560px;height:582px;
        transform-origin:50% 92%;transform-style:preserve-3d;will-change:transform;
        filter:drop-shadow(0 14px 18px rgba(0,0,0,.38));
        animation:breathe 4.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  #open,#closed{position:absolute;left:0;top:0;width:560px;height:582px}
  #closed{opacity:0}

  /* ---- 动作 ---- */
  /* 翻跟头：二维空中空翻（原来是绕竖轴转，看起来和「转圈圈」一样） */
  #char.flip{animation:flip 1s cubic-bezier(.4,.05,.6,.95);transform-origin:50% 50%}
  @keyframes flip{
    0%{transform:translateY(0) rotate(0deg) scale(1)}
    18%{transform:translateY(12px) rotate(0deg) scale(1.06,.92)}
    50%{transform:translateY(-110px) rotate(180deg) scale(1)}
    82%{transform:translateY(-14px) rotate(345deg) scale(1.02,.97)}
    100%{transform:translateY(0) rotate(360deg) scale(1)}}
  #shadow.flip{animation:shFlip 1s ease-in-out}
  @keyframes shFlip{0%,100%{transform:scaleX(1);opacity:.45}50%{transform:scaleX(.7);opacity:.3}}

  /* 转圈圈：绕自身中心转，带轻微俯仰 */
  #char.spin{animation:spin 1.2s ease-in-out}
  @keyframes spin{
    0%{transform:rotateY(0) rotateX(0)}
    50%{transform:rotateY(180deg) rotateX(6deg)}
    100%{transform:rotateY(360deg) rotateX(0)}}
  #shadow.spin{animation:shSpin 1.2s ease-in-out}
  @keyframes shSpin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.85)}}

  /* 摇摆舞：左右倾 + 身体侧倾（skew） */
  #char.dance{animation:dance 1.4s ease-in-out}
  @keyframes dance{
    0%,100%{transform:translateX(0) rotateZ(0) skewX(0)}
    20%{transform:translateX(-18px) rotateZ(-6deg) skewX(4deg)}
    40%{transform:translateX(18px) rotateZ(6deg) skewX(-4deg)}
    60%{transform:translateX(-13px) rotateZ(-4deg) skewX(3deg)}
    80%{transform:translateX(13px) rotateZ(4deg) skewX(-3deg)}}
  #shadow.dance{animation:shDance 1.4s ease-in-out}
  @keyframes shDance{0%,100%{transform:translateX(0) scaleX(1)}
    20%{transform:translateX(-14px) scaleX(.95)}40%{transform:translateX(14px) scaleX(.95)}
    60%{transform:translateX(-10px) scaleX(.97)}80%{transform:translateX(10px) scaleX(.97)}}

  /* 跳高高：起跳前下蹲挤压，落地下压 */
  #char.bigjump{animation:bigjump .95s ease-out}
  @keyframes bigjump{
    0%{transform:translateY(0) scaleY(1) scaleX(1)}
    12%{transform:translateY(14px) scaleY(.9) scaleX(1.06)}
    45%{transform:translateY(-105px) scaleY(1.08) scaleX(.95)}
    70%{transform:translateY(0) scaleY(.95) scaleX(1.04)}
    85%{transform:translateY(-14px) scaleY(1.01) scaleX(.99)}
    100%{transform:translateY(0) scaleY(1) scaleX(1)}}
  #shadow.bigjump{animation:shJump .95s ease-out}
  @keyframes shJump{0%{transform:scale(1);opacity:.45}
    12%{transform:scale(1.1);opacity:.55}
    45%{transform:scale(.62);opacity:.22}
    70%{transform:scale(1.05);opacity:.5}
    100%{transform:scale(1);opacity:.45}}

  /* 歪头卖萌：歪头 + 轻微前倾 */
  #char.tilt{animation:tilt 1.1s ease-in-out}
  @keyframes tilt{
    0%,100%{transform:rotateZ(0) rotateY(0)}
    30%{transform:rotateZ(14deg) rotateY(-12deg) translateX(8px)}
    65%{transform:rotateZ(-10deg) rotateY(10deg) translateX(-7px)}}
  #shadow.tilt{animation:shTilt 1.1s ease-in-out}
  @keyframes shTilt{0%,100%{transform:translateX(0)}30%{transform:translateX(10px)}65%{transform:translateX(-8px)}}

  /* 连翻带跳：翻一圈 + 两次跳 */
  #char.combo{animation:combo 1.7s ease-in-out}
  @keyframes combo{
    0%{transform:rotateY(0) translateY(0)}
    25%{transform:rotateY(180deg) translateY(-40px)}
    45%{transform:rotateY(360deg) translateY(0)}
    60%{transform:translateY(-60px) scaleY(1.06)}
    75%{transform:translateY(0) scaleY(.95)}
    88%{transform:translateY(-24px)}
    100%{transform:translateY(0) scaleY(1)}}
  #shadow.combo{animation:shCombo 1.7s ease-in-out}
  @keyframes shCombo{0%,100%{transform:scale(1);opacity:.45}
    25%{transform:scale(.8);opacity:.3}60%{transform:scale(.6);opacity:.2}88%{transform:scale(.85);opacity:.35}}

  /* 摸鱼/待机额外：轻微前后晃，增加体积感 */
  #char.wag{animation:wagSmall .5s ease-in-out 3}
  @keyframes wagSmall{0%,100%{transform:rotateY(0)}50%{transform:rotateY(10deg)}}
  #char.talk{animation:talk .34s ease-in-out infinite alternate}
  @keyframes talk{from{transform:translateY(0)}to{transform:translateY(-16px)}}

  #feed{position:absolute;right:44px;top:1160px;width:320px;padding:18px 20px;
        background:rgba(8,20,44,.55);border:2px solid rgba(90,150,220,.35);border-radius:20px;
        color:#dbe9ff;font-size:23px;line-height:1.6;min-height:150px}
  #feed .fh{font-size:24px;color:#9fd0ff;font-weight:700;margin-bottom:8px}
  #feed .row{margin:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---- 节目单 ---- */
  #heart{position:absolute;left:520px;top:900px;transform:translateX(-50%);
         font-size:0;line-height:1;opacity:0;pointer-events:none;color:#ff5d8f;
         text-shadow:0 0 28px rgba(255,93,143,.65);z-index:9}
  #heart.show{animation:heartPop 1.9s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes heartPop{
    0%{opacity:0;font-size:30px;transform:translateX(-50%) translateY(40px) scale(.4)}
    20%{opacity:1;font-size:130px;transform:translateX(-50%) translateY(0) scale(1.2)}
    55%{opacity:1;font-size:130px;transform:translateX(-50%) translateY(-30px) scale(1)}
    100%{opacity:0;font-size:130px;transform:translateX(-50%) translateY(-70px) scale(.85)}
  }
  #char.heart{animation:heartWiggle 1.5s ease-in-out}
  @keyframes heartWiggle{
    0%,100%{transform:rotate(0) scale(1)}
    25%{transform:rotate(-5deg) scale(1.05)}
    75%{transform:rotate(5deg) scale(1.05)}
  }

  #menu{position:absolute;right:44px;top:770px;width:320px;padding:20px 22px;
        background:rgba(8,20,44,.62);border:2px solid rgba(90,150,220,.45);border-radius:22px;
        color:#cfe3ff;font-size:24px;line-height:1.7;backdrop-filter:blur(2px)}
  #menu h3{margin:0 0 10px;font-size:28px;color:#9fd0ff;font-weight:700;letter-spacing:1px}
  #menu .row{display:flex;justify-content:space-between;gap:8px}
  #menu .g{color:#ffd8a8}
  #menu .a{color:#bfe6ff}
  #menu .tip{margin-top:10px;font-size:22px;color:#7fa6d0}
</style></head>
<body>
<div id="stage">
  <div id="menu">
    <h3>互动节目单</h3>
    <div class="row"><span class="g">小心心</span><span class="a">翻跟头</span></div>
    <div class="row"><span class="g">玫瑰</span><span class="a">转圈圈</span></div>
    <div class="row"><span class="g">大啤酒</span><span class="a">跳舞</span></div>
    <div class="row"><span class="g">摩天轮</span><span class="a">跳高高</span></div>
    <div class="row"><span class="g">点歌 歌名</span><span class="a">排队播放</span></div>

    <div class="tip">送礼物她会念出来，点歌要排队</div>
  </div>

  <div id="heart">💗</div>
  <div id="shadow"></div>
  <div id="feed">
    <div class="fh">实时弹幕</div>
    <div id="fl"></div>
  </div>

  <div id="charWrap"><div id="char">
    <img id="open" src="形象-睁眼.png">
    <img id="closed" src="形象-闭眼.png">
  </div></div>
</div>
<script>
const openImg = document.getElementById("open");
const closedImg = document.getElementById("closed");
const char = document.getElementById("char");
const shadow = document.getElementById("shadow");
const fl = document.getElementById("fl");
const charWrap = document.getElementById("charWrap");

let blinkTimer = null;
function blink(){
  closedImg.style.opacity = 1;
  setTimeout(() => { closedImg.style.opacity = 0; }, 110);
  setTimeout(blink, 2200 + Math.random() * 3000);
}
setTimeout(blink, 1200 + Math.random() * 1500);

const ACTIONS = ["flip","spin","wobble","bigjump","tilt","dance"];
const ALL_ACTIONS = ["flip","spin","wobble","bigjump","tilt","dance","combo","wag","heart"];
const heartEl = document.getElementById("heart");
function playAction(name){
  if (!name || ALL_ACTIONS.indexOf(name) < 0) return;
  if (name === "heart") {
    heartEl.classList.remove("show");
    void heartEl.offsetWidth;
    heartEl.classList.add("show");
    setTimeout(() => heartEl.classList.remove("show"), 1900);
  }
  char.classList.remove("talk");
  ALL_ACTIONS.forEach(a => { char.classList.remove(a); shadow.classList.remove(a); });
  void char.offsetWidth;
  char.classList.add(name);
  shadow.classList.add(name);
  setTimeout(() => { char.classList.remove(name); shadow.classList.remove(name); }, 1700);
}

let last = {talking:false, action:""};
async function poll(){
  try{
    const r = await fetch("http://127.0.0.1:8788/state", {cache:"no-store"});
    const s = await r.json();
    if (s.action && s.action !== last.action) playAction(s.action);
    else if (s.wag && !last.wag) playAction("wag");
    else if (s.talking && !char.classList.contains("talk") && !s.action) char.classList.add("talk");
    if (!s.talking) char.classList.remove("talk");
    if (s.recent) {
      var html = "";
      for (var i = Math.max(0, s.recent.length - 3); i < s.recent.length; i++) {
        html += '<div class="row">' + String(s.recent[i]).replace(/[<>&]/g, "") + '</div>';
      }
      if (fl.innerHTML !== html) fl.innerHTML = html;
    }
    last = {talking: !!s.talking, action: s.action || "", wag: !!s.wag};
  }catch(e){}
  setTimeout(poll, 150);
}
poll();

// 每隔几秒自动做一个小动作，避免画面"定格"
const IDLES = ["idleBob", "idleSway", "idleTilt", "idleWiggle"];
function idleTick(){
  const a = IDLES[Math.floor(Math.random() * IDLES.length)];
  IDLES.forEach(x => charWrap.classList.remove(x));
  void charWrap.offsetWidth;
  charWrap.classList.add(a);
  setTimeout(() => charWrap.classList.remove(a), 1500);
}
setInterval(idleTick, 2800);
setTimeout(idleTick, 800);
</script>
</body></html>
